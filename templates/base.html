{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Staff Portal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
{% if user.is_authenticated %}
    <nav class="top-nav">
        <a href="{% url 'home' %}">Home</a> |
        <a href="{% url 'staff_list' %}">Staff</a> |
        <a href="{% url 'dashboard_stats' %}">Graphical View</a> |
        {% if user.is_staff %}
        <a href="{% url 'add_staff' %}">Add Staff</a> 
        {% endif %}
        <a href="{% url 'terminated_staff' %}">Separated Staff</a> |
        <a href="{% url 'logout' %}">Logout</a> |
    </nav>
{% endif %}

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
