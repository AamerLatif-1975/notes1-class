{% extends 'base.html' %}

{% block title %}Delete History Record{% endblock %}

{% block content %}

<h2>Delete this history record?</h2>
<p><b>Position:</b> {{ object.position }}</p>
<p><b>Start Date:</b> {{ object.start_date }}</p>
<p><b>Staff Member:</b> {{ object.staff.name }}</p>
<form method="POST">
    {% csrf_token %}
    <input type="submit" value="Yes, delete">
</form>
<a href="{% url 'staff_history' object.staff.pk %}">Cancel</a>
{% endblock %}
